# VocalRender NAR ablation, stage 2: stage-1 EMA -> the five real-singing corpora.
# Architecture, mel and objective are F5TTS_v1_Base unchanged; only the data
# (VocalRender's interleaved score in the text channel, exported by the VoxCPM
# repo's scripts/export_f5_svs_dataset.py) and the vocab (+397 score tokens,
# f5_tts.scripts.expand_vocab_svs) differ.
#
# Data is found the F5 way, data/<datasets.name>_<tokenizer>/, which the
# launcher symlinks to /dataset/cyk/F5-SVS/finetune. Stage 1's EMA weights are
# placed in save_dir as pretrained_*.safetensors: fresh optimizer/scheduler.
#
# Budget: as stage 1, a constant LR after warmup (a tenth of stage 1's peak),
# epochs only an upper bound, stopped early on the audio validation.
# 2 x A100 40G (NVLink) x 38400 frames = ~820 s of audio per update, so the
# five corpora (347 h) are 1853 updates per epoch (measured), ~93k at most.

hydra:
  run:
    dir: ${ckpts.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}

datasets:
  name: F5SVS_finetune
  batch_size_per_gpu: 38400   # fits 40G with the launcher's expandable_segments (peak 36.3 GB)
  batch_size_type: frame
  max_samples: 64
  num_workers: 16

optim:
  epochs: 50                  # upper bound only: early stop on validation
  learning_rate: 7.5e-6       # stage 1's peak / 10
  num_warmup_updates: 500
  lr_schedule: constant       # hold the peak LR after warmup (F5 default: linear_decay)
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  bnb_optimizer: False

model:
  name: F5TTS_v1_Base_svs
  tokenizer: custom
  tokenizer_path: /dataset/cyk/F5-SVS/finetune/vocab.txt
  backbone: DiT
  compile: True   # per-block torch.compile: 1.7x/step, -16 GiB (VoxCPM docs/experiments/f5tts_nar_ablation.md)
  arch:
    dim: 1024
    depth: 22
    heads: 16
    ff_mult: 2
    text_dim: 512
    text_mask_padding: True
    qk_norm: null
    conv_layers: 4
    pe_attn_head: null
    attn_backend: torch
    attn_mask_enabled: False
    checkpoint_activations: False
  mel_spec:
    target_sample_rate: 24000
    n_mel_channels: 100
    hop_length: 256
    win_length: 1024
    n_fft: 1024
    mel_spec_type: vocos
  vocoder:
    is_local: True
    local_path: /export/home2/n2505683d/VoxCPM/pretrained_models/vocos-mel-24khz

ckpts:
  logger: tensorboard
  wandb_run_name: ${model.name}_finetune
  log_samples: True
  save_per_updates: 5000
  keep_last_n_checkpoints: 10  # 50k updates of history (5.4 GB each) to pick the early-stop point from
  last_per_updates: 1000
  save_dir: /export/home2/n2505683d/VoxCPM/checkpoints/f5-svs/finetune
  tensorboard_dir: ${ckpts.save_dir}/logs   # with the checkpoints, as VocalRender's <save_path>/logs

# Validation loss (the training flow-matching loss, deterministic, CFG dropout off)
# on the same CrawlSinger-zh-test items as the audio validation, with their
# recordings; as VocalRender's val_loss (valid_interval 1000). The dataset is
# written by the VoxCPM repo's scripts/export_f5_svs_valset.py.
val_loss:
  dataset_dir: /export/home2/n2505683d/VoxCPM/benchmark/crawlsinger_test/f5_svs
  every_updates: 1000
  at_start: True
  seed: 0
  num_workers: 4

# Audio validation, the same as VocalRender's (SingMOS / AES / HubertFA -> GAME,
# voxcpm.f5_svs.validation) on CrawlSinger-zh-test with the EMA weights. Needs the
# eval stack in F5-TTS/.venv (scripts/bootstrap_f5tts_env.sh) and the F5 text of
# the manifest (scripts/export_f5_svs_valset.py).
validation:
  target: voxcpm.f5_svs.validation.F5SVSValidator
  every_updates: 5000
  at_start: False
  kwargs:
    manifest_dir: /export/home2/n2505683d/VoxCPM/benchmark/crawlsinger_test
    vocoder_path: ${model.vocoder.local_path}
    eval_config: conf/voxcpm_v2/base.yaml   # its eval_metrics block, relative to the VoxCPM repo
    num_samples: -1                         # -1 = all 2969, as VocalRender's pretrain config
    tb_max_samples: 20
    nfe_step: 32
    cfg_strength: 2.0
    sway_sampling_coef: -1.0
    max_batch_frames: 48000
    compile: True                           # the eval copy's blocks, as model.compile
    summary_dir: ${ckpts.save_dir}/val
